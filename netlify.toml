[build]
  command = "node netlify/build.js"
  publish = "site"

# Netlify only serves the static landing page (no PHP runtime, no MySQL).
# The Express+MySQL API and the PHP admin portal must run on another host (Render/Railway/VPS).
#
# Configure them as Netlify environment variables (Site configuration -> Environment variables),
# then redeploy:
#   BACKEND_URL = https://your-api.onrender.com   (live status board, pricing, bookings, ordering)
#   ADMIN_URL   = https://your-admin.onrender.com (the "Portal Login" button)
# Also set CORS_ORIGIN on the backend to this site's URL so the browser is allowed to call it.
