[build]
  command = "node netlify/build.js"
  publish = "site"

# The static landing page only. The PHP admin portal + Express API + MySQL run elsewhere
# (Render/Railway). Replace the placeholder hosts below with your real service URLs.

# API proxy -> keeps requests same-origin (no CORS, no http/https mixed content).
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-BACKEND.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://YOUR-BACKEND.onrender.com/uploads/:splat"
  status = 200
  force = true

# "Portal Login" button on the landing page points here (your PHP admin on Render).
[[redirects]]
  from = "/portal"
  to = "https://YOUR-APP.onrender.com/pages/login.php"
  status = 302
  force = true
